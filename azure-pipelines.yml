trigger:
  - main

variables:
  - name: serviceConnection
    value: 'CandidateProject-2'
  - name: tfworkingDirectory
    value: '$(Build.SourcesDirectory)/terraform'
  - name: environment
    value: 'prod'
  - name: ARM_CLIENT_ID
    value: '$(servicePrincipalId)'
  - name: ARM_CLIENT_SECRET
    value: '$(servicePrincipalKey)'
  - name: ARM_SUBSCRIPTION_ID
    value: '$(subscriptionId)'
  - name: ARM_TENANT_ID
    value: '$(tenantId)'

stages:
- stage: SecurityScan
  jobs:
  - job: TerraformScan
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - script: |
        echo "Listing source directory to verify terraform folder:"
        ls -la "$(Build.SourcesDirectory)"
        if [ ! -d "$(Build.SourcesDirectory)/terraform" ]; then
          echo "ERROR: terraform directory not found!"
          exit 1
        fi
      displayName: 'Verify Terraform Directory'

    - script: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y gnupg software-properties-common curl unzip
        curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update && sudo apt-get install -y terraform
        terraform version
      displayName: 'Install Terraform'

    - script: |
        set -euo pipefail
        curl -fSL -o tfsec https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64
        chmod +x tfsec
        ./tfsec "$(tfworkingDirectory)" --format junit > test-results.xml || echo "tfsec failed"
      displayName: 'Run tfsec Security Scanner'

    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/test-results.xml'
        testRunTitle: 'Terraform Security Scan'
      condition: succeededOrFailed()

- stage: Validate
  jobs:
  - job: ValidateAndPlan
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - script: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y gnupg software-properties-common curl unzip
        curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo apt-get update && sudo apt-get install -y terraform
        terraform version
      displayName: 'Install Terraform'

    - script: |
        set -euo pipefail
        cd "$(tfworkingDirectory)"
        terraform init \
          -backend-config="resource_group_name=webapp-rg1" \
          -backend-config="storage_account_name=mytfstatefiles1" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=terraform.tfstate" \
          -backend-config="subscription_id=$(ARM_SUBSCRIPTION_ID)" \
          -backend-config="tenant_id=$(ARM_TENANT_ID)" \
          -backend-config="client_id=$(ARM_CLIENT_ID)" \
          -backend-config="client_secret=$(ARM_CLIENT_SECRET)"
      displayName: 'Terraform Init'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)

    - script: |
        set -euo pipefail
        cd "$(tfworkingDirectory)"
        terraform validate
      displayName: 'Terraform Validate'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)

    - script: |
        set -euo pipefail
        cd "$(tfworkingDirectory)"
        terraform plan -out="$(Build.ArtifactStagingDirectory)/terraform.tfplan"
      displayName: 'Terraform Plan'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)

    - publish: $(Build.ArtifactStagingDirectory)/terraform.tfplan
      artifact: TerraformPlan

- stage: Deploy
  dependsOn:
    - SecurityScan
    - Validate
  condition: succeeded()
  jobs:
  - deployment: ApplyTerraform
    environment: $(environment)
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - script: |
              set -euo pipefail
              sudo apt-get update
              sudo apt-get install -y gnupg software-properties-common curl unzip
              curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
              sudo apt-get update && sudo apt-get install -y terraform
              terraform version
            displayName: 'Install Terraform'

          - script: |
              set -euo pipefail
              cd "$(tfworkingDirectory)"
              terraform init \
                -backend-config="resource_group_name=webapp-rg1" \
                -backend-config="storage_account_name=mytfstatefiles1" \
                -backend-config="container_name=tfstate" \
                -backend-config="key=terraform.tfstate"
            displayName: 'Terraform Init'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

          - download: current
            artifact: TerraformPlan

          - script: |
              set -euo pipefail
              cd "$(tfworkingDirectory)"
              terraform apply -auto-approve "$(Pipeline.Workspace)/TerraformPlan/terraform.tfplan"
            displayName: 'Terraform Apply'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

- stage: SecurityValidation
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: RunSecurityScans
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self

    - task: AzurePowerShell@5
      inputs:
        azureSubscription: '$(serviceConnection)'
        ScriptType: 'InlineScript'
        Inline: |
          Set-AzSecurityPricing -Name "VirtualMachines" -PricingTier "Standard"
          $assessment = Get-AzSecurityAssessment -ResourceGroupName "webapp-rg1"
          $assessment | ConvertTo-Json | Out-File "security-assessment.json"
        azurePowerShellVersion: 'LatestVersion'

    - publish: security-assessment.json
      artifact: SecurityAssessment
