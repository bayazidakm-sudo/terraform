trigger:
  - main

variables:
  - name: serviceConnection
    value: 'CandidateProject-2'
  - name: tfworkingDirectory
    value: '$(System.DefaultWorkingDirectory)/terraform'
  - name: environment
    value: 'prod'
  # Azure authentication variables
  - name: ARM_CLIENT_ID
    value: '$(servicePrincipalId)'
  - name: ARM_CLIENT_SECRET
    value: '$(servicePrincipalKey)'
  - name: ARM_SUBSCRIPTION_ID
    value: '$(subscriptionId)'
  - name: ARM_TENANT_ID
    value: '$(tenantId)'

stages:
- stage: SecurityScan
  jobs:
  - job: TerraformScan
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # Install and verify Terraform
    - script: |
        set -euo pipefail
        # Install Terraform
        echo "Installing Terraform..."
        sudo apt-get update
        sudo apt-get install -y terraform

        # Verify installation and create symlink if needed
        if ! command -v terraform &> /dev/null; then
          echo "Terraform not found in PATH. Creating symlink..."
          sudo ln -s $(find /usr -name terraform) /usr/local/bin/terraform
        fi

        # Double check installation
        TERRAFORM_PATH=$(which terraform)
        echo "Terraform path: $TERRAFORM_PATH"
        ls -l $TERRAFORM_PATH
        $TERRAFORM_PATH version
      displayName: 'Install Terraform'
    
    - script: |
        set -euo pipefail
        TFSEC_URL="https://github.com/aquasecurity/tfsec/releases/latest/download/tfsec-linux-amd64"
        echo "Downloading tfsec from $TFSEC_URL"
        # -f fails on HTTP errors, -S shows errors, -L follows redirects
        curl -fSL -o tfsec "$TFSEC_URL"
        if [ ! -s tfsec ]; then
          echo "tfsec binary not downloaded or empty" >&2
          exit 1
        fi
        chmod +x tfsec
        echo "tfsec version: $(./tfsec --version || echo 'unknown')"
        # Quote the working directory variable to handle spaces
        TF_DIR="$(tfworkingDirectory)"
        echo "Running tfsec against: $TF_DIR"
        # Run tfsec and ensure valid XML output
        if ! ./tfsec "$TF_DIR" --format junit > test-results.xml.tmp; then
          echo "tfsec found issues but continuing..."
        fi
        
        # Verify XML is valid before publishing
        if xmllint --noout test-results.xml.tmp 2>/dev/null; then
          mv test-results.xml.tmp test-results.xml
          echo "Valid JUnit XML generated"
        else
          # Generate a valid XML with error message if tfsec output is invalid
          cat > test-results.xml << EOF
<?xml version="1.0" encoding="UTF-8"?>
<testsuites>
  <testsuite name="tfsec" tests="1" failures="1">
    <testcase name="tfsec_scan" classname="SecurityScan">
      <failure message="Failed to generate valid tfsec output">Check terraform directory manually</failure>
    </testcase>
  </testsuite>
</testsuites>
EOF
          echo "Generated fallback XML due to invalid tfsec output"
        fi
        
        echo "Final output files:"
        ls -l tfsec test-results.xml
      displayName: 'Run tfsec Security Scanner'
    
    - task: PublishTestResults@2
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/test-results.xml'
        testRunTitle: 'Terraform Security Scan'
      condition: succeededOrFailed()

- stage: Validate
  jobs:
  - job: ValidateAndPlan
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    # Install Terraform using HashiCorp's official repository
    - script: |
        set -euo pipefail
        echo "Installing HashiCorp GPG key..."
        wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        
        echo "Adding HashiCorp repository..."
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        
        echo "Updating package list and installing Terraform..."
        sudo apt-get update && sudo apt-get install -y terraform
        
        echo "Verifying Terraform installation..."
        terraform version
      displayName: 'Install Terraform'
    
    - script: |
        set -euo pipefail
        cd $(tfworkingDirectory)
        
        # Initialize Terraform with backend config
        terraform init \
          -backend-config="resource_group_name=webapp-rg1" \
          -backend-config="storage_account_name=mytfstatefiles1" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=terraform.tfstate"
      displayName: 'Terraform Init'
      env:
        # Using service principal authentication
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
    
    - script: |
        set -euo pipefail
        cd $(tfworkingDirectory)
        terraform validate
      displayName: 'Terraform Validate'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
    
    - script: |
        set -euo pipefail
        cd $(tfworkingDirectory)
        terraform plan -out=$(Build.ArtifactStagingDirectory)/terraform.tfplan
      displayName: 'Terraform Plan'
      env:
        ARM_CLIENT_ID: $(ARM_CLIENT_ID)
        ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
        ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        ARM_TENANT_ID: $(ARM_TENANT_ID)
    
    - publish: $(Build.ArtifactStagingDirectory)/terraform.tfplan
      artifact: TerraformPlan

- stage: Deploy
  dependsOn: 
  - SecurityScan
  - Validate
  condition: succeeded()
  jobs:
  - deployment: ApplyTerraform
    environment: $(environment)
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          # Install Terraform using HashiCorp's official repository
          - script: |
              set -euo pipefail
              echo "Installing HashiCorp GPG key..."
              wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
              
              echo "Adding HashiCorp repository..."
              echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
              
              echo "Updating package list and installing Terraform..."
              sudo apt-get update && sudo apt-get install -y terraform
              
              echo "Verifying Terraform installation..."
              terraform version
            displayName: 'Install Terraform'
          
          - script: |
              set -euo pipefail
              cd $(tfworkingDirectory)
              
              # Initialize Terraform with backend config and OIDC support
              terraform init \
                -backend-config="resource_group_name=webapp-rg1" \
                -backend-config="storage_account_name=mytfstatefiles1" \
                -backend-config="container_name=tfstate" \
                -backend-config="key=terraform.tfstate" \
                -backend-config="use_oidc=true" \
                -backend-config="oidc_token=$(AZURE_FEDERATED_TOKEN)"
            displayName: 'Terraform Init'
            env:
              ARM_USE_OIDC: "true"
              ARM_CLIENT_ID: $(servicePrincipalId)
              ARM_TENANT_ID: $(tenantId)
              ARM_SUBSCRIPTION_ID: $(subscriptionId)
              ARM_OIDC_TOKEN: $(AZURE_FEDERATED_TOKEN)
          
          - download: current
            artifact: TerraformPlan

          - script: |
              set -euo pipefail
              cd $(tfworkingDirectory)
              terraform apply -auto-approve $(Pipeline.Workspace)/TerraformPlan/terraform.tfplan
            displayName: 'Terraform Apply'
            env:
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)

- stage: SecurityValidation
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: RunSecurityScans
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzurePowerShell@5
      inputs:
        azureSubscription: '$(serviceConnection)'
        ScriptType: 'InlineScript'
        Inline: |
          # Enable Microsoft Defender for Cloud
          Set-AzSecurityPricing -Name "VirtualMachines" -PricingTier "Standard"
          
          # Get Security Assessment
          $assessment = Get-AzSecurityAssessment -ResourceGroupName "$(resourceGroupName)"
          $assessment | ConvertTo-Json | Out-File "security-assessment.json"
        azurePowershellVersion: 'LatestVersion'
    
    - publish: security-assessment.json
      artifact: SecurityAssessment
